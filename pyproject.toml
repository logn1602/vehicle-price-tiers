[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vehicle-price-tiers"
version = "0.1.0"
description = "Ordinal price-tier classification for used-vehicle Craigslist listings"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- core data ---
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=16,<22",          # Parquet engine for bronze/silver/gold
    "duckdb>=1.0,<2",           # SQL directly over Parquet for EDA
    "pandera>=0.20,<0.30",      # schema contracts
    "pyyaml>=6,<7",             # conf/config.yaml

    # --- modelling ---
    "scikit-learn>=1.5,<2",
    "xgboost>=2.1,<4",          # >=2.0 moves early_stopping_rounds to the constructor
    "scipy>=1.11,<2",
    "joblib>=1.4,<2",           # model persistence for the inference service

    # --- figures ---
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<0.15",

    # --- tracking ---
    "mlflow>=2.16,<4",

    # --- serving ---
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",           # required by fastapi.testclient.TestClient
    "ruff>=0.6,<1",
    "pypdf>=5,<7",              # scripts/audit_v1_report.py reads the v1 report
    "ipykernel>=6.29,<7",       # notebooks/01_eda.ipynb
    "nbconvert>=7.16,<8",       # execute the notebook top-to-bottom in CI
    "nbformat>=5.10,<6",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors -- E722 bans bare `except:` (brief section 0)
    "F",      # pyflakes
    "I",      # import sorting
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "PD",     # pandas-vet
    "NPY",    # numpy-specific
    "RET",    # return consistency
    "ARG",    # unused arguments
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]            # pytest fixtures are legitimately unused args

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: touches the full dataset; deselect in CI with -m 'not slow'",
]
